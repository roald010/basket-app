name: Changelog

# Every PR must record its change in CHANGELOG.md under [Unreleased]. Attach the
# `no-changelog` label to a PR to skip this check (e.g. a pure CI/docs tweak).
#
# The job always runs (rather than being skipped via a top-level `if`) so it always
# reports a pass/fail conclusion -- a job skipped by `if` shows as "skipped", which
# never satisfies a required status check and would silently block merges.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  changelog:
    name: CHANGELOG.md updated
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require CHANGELOG.md in the diff
        env:
          HAS_SKIP_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'no-changelog') }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$HAS_SKIP_LABEL" = "true" ]; then
            echo "no-changelog label present — skipping changelog requirement."
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          if git diff --name-only "origin/$BASE_REF"...HEAD | grep -qx 'CHANGELOG.md'; then
            echo "CHANGELOG.md is updated."
          else
            echo "::error::CHANGELOG.md was not updated. Add an entry under [Unreleased], or apply the 'no-changelog' label."
            exit 1
          fi
