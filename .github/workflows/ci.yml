name: CI

# Runs on every pull request (any base branch) and on pushes to main, so each change
# is verified before and after merge. Keep this green: it is the gate the PR workflow
# relies on. Node 22 is required by the test job's TypeScript type-stripping.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    name: typecheck + lint + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test
